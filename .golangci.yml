version: 2

run:
  timeout: 3m
  issues-exit-code: 1

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - revive

linters-settings:
  revive:
    confidence: 0.8
    severity: warning
    rules:
      - name: exported
        arguments:
          - allow-leading-underscore
      - name: var-naming
      - name: package-comments

issues:
  exclude-use-default: false
  max-issues-per-linter: 50
  max-same-issues: 3

